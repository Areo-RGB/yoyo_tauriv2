[package]
name = "yoyo_tauri"
version = "1.0.0"
description = "Yo-Yo and 20m shuttle fitness test tracker"
authors = ["YoYo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "yoyo_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-store = "2.4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
local-ip-address = "0.6"
